name: mobile
description: "DVLP Sports team development platform"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.6.1

  # Backend
  supabase_flutter: ^2.8.0

  # Design system
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Onboarding
  pinput: ^5.0.0

  # Config
  flutter_dotenv: ^5.2.1

  # Local key-value storage (notifications last-seen state)
  shared_preferences: ^2.3.2

  # Avatar upload — pick from camera roll + resize/compress client-side
  # to a ~50–80 KB JPEG before base64-encoding for the edge fn.
  image_picker: ^1.1.2
  image: ^4.2.0

  # Voice notes on formal/quick assessments. Hybrid setup because
  # audio_waveforms' recorder doesn't reliably capture audio on the
  # iOS simulator (produces a header-only file). Split of concerns:
  #   - `record` (v7): reliable capture on device + simulator.
  #   - `audio_waveforms.PlayerController` + AudioFileWaveforms: the
  #     playback UX (real waveform from the extracted samples, played
  #     portion highlighted, tap-to-seek).
  # `permission_handler` asks for mic access on first record.
  record: ^7.0.0
  audio_waveforms: ^1.3.0
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/untitled/
    - assets/icons/custom/
    - assets/brand/logo.png
    - assets/badges/
